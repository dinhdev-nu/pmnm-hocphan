<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh viên</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .filter-bar a { margin-right: 10px; text-decoration: none; padding: 5px 10px; background: #eee; border-radius: 4px; }
        .filter-bar a.active { background: #007bff; color: white; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Trang chủ</a> | <a href="/students">Danh sách sinh viên</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
